version: 2
updates:
  # Separate Bun lockfiles preserve the package, harness and website boundaries.
  - package-ecosystem: 'bun'
    # Look for `package.json` and `lock` files in the `root` directory
    directory: '/'
    # Check the npm registry for updates once a week (Monday)
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'bun'
    directory: '/website'
    schedule:
      interval: 'weekly'
    groups:
      docusaurus:
        patterns: ['@docusaurus/*']

  - package-ecosystem: 'bun'
    directory: '/harness'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
